name: CI — ShellCheck y Gitleaks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  shellcheck:
    name: ShellCheck (validar scripts bash)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ejecutar ShellCheck
        # FIX 18.5: antes 'ludeeus/action-shellcheck@master' (rama mutable).
        # Pin a versión estable; para máximo rigor, fijar a un SHA de commit.
        uses: ludeeus/action-shellcheck@v2.0.0
        with:
          scandir: '.'
          ignore_paths: 'configs/static/templates'
          ignore_names: '.*\.json .*\.txt .*\.md'

  gitleaks:
    name: Gitleaks (detección de secretos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks escanea también el historial de commits
      - name: Ejecutar Gitleaks
        # FIX 18.5: impide que se cuele un .env o credencial en el futuro.
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
